home-ops-app-chart:
  image:
    repository: louislam/uptime-kuma
    tag: "1"
    pullPolicy: IfNotPresent

  strategy:
    type: Recreate

  ports:
    - name: http
      containerPort: 3001
      protocol: TCP

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10

  service:
    ports:
      - port: 3001
        targetPort: http
        protocol: TCP
        name: http

  home-ops-route-chart:
    enabled: true
    host: uptime.schober.dev
    backend:
      port: 3001

  persistence:
    data:
      enabled: true
      existingClaim: uptime-kuma-data
      size: 2Gi
      mountPath: /app/data

pvc:
  name: uptime-kuma-data
  storageClass: longhorn
  size: 2Gi

