home-ops-app-chart:
  image:
    repository: ghcr.io/alam00000/bentopdf-simple
    tag: "sha-daae736"
    pullPolicy: IfNotPresent

  ports:
    - name: http
      containerPort: 8080
      protocol: TCP

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  service:
    ports:
      - port: 80
        targetPort: http
        protocol: TCP
        name: http

  home-ops-route-chart:
    enabled: true
    host: pdf.schober.dev

