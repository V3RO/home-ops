{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Release.Name }}-secrets
    template:
      engineVersion: v2
      data:
        SECRET_KEY: '{{ `{{ .secretKey }}` }}'
        DATABASE_URL: 'postgresql+asyncpg://{{ .Release.Name }}:{{ `{{ .dbPassword | urlquery }}` }}@{{ .Release.Name }}-postgres-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Release.Name }}'
        REDIS_URL: 'redis://:{{ `{{ .valkeyPassword | urlquery }}` }}@valkey.valkey.svc.cluster.local:6379/5'
        OIDC_CLIENT_ID: '{{ .Release.Name }}'
        OIDC_CLIENT_SECRET: '{{ `{{ .oidcClientSecret }}` }}'
        ENABLE_BANKING_APP_ID: '{{ `{{ .enableBankingAppId }}` }}'
        ENABLE_BANKING_PRIVATE_KEY: |
          {{ `{{ .enableBankingPrivateKey }}` }}
  data:
    - secretKey: secretKey
      remoteRef:
        key: {{ .Values.externalSecret.keys.secretKey }}
    - secretKey: valkeyPassword
      remoteRef:
        key: {{ .Values.externalSecret.keys.valkeyPassword }}
    - secretKey: oidcClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.keys.oidcClientSecret }}
    - secretKey: enableBankingAppId
      remoteRef:
        key: {{ .Values.externalSecret.keys.enableBankingAppId }}
    - secretKey: enableBankingPrivateKey
      remoteRef:
        key: {{ .Values.externalSecret.keys.enableBankingPrivateKey }}
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.externalSecret.keys.dbPassword }}
      sourceRef:
        storeRef:
          name: {{ .Values.externalSecret.cnpgSecretStoreRef.name }}
          kind: {{ .Values.externalSecret.cnpgSecretStoreRef.kind }}
{{- end }}
