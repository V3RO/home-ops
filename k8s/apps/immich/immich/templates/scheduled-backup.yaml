{{- if .Values.postgres.enabled }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-versitygw-store
  namespace: {{ .Release.Namespace }}
spec:
  retentionPolicy: 7d
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: homelab
  configuration:
    destinationPath: s3://cnpg-backups/immich/
    endpointURL: http://versitygw.versitygw.svc.cluster.local:7070
    s3Credentials:
      accessKeyId:
        name: cnpg-immich-backup-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-immich-backup-credentials
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: backup-{{ .Values.postgres.clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: immich-versitygw-store
  cluster:
    name: {{ .Values.postgres.clusterName }}
{{- end }}
