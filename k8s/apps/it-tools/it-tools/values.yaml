home-ops-app-chart:
  image:
    repository: ghcr.io/corentinth/it-tools
    tag: "2024.10.22-7ca5933"
    pullPolicy: IfNotPresent

  ports:
    - name: http
      containerPort: 80
      protocol: TCP

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  service:
    ports:
      - port: 80
        targetPort: http
        protocol: TCP
        name: http

  home-ops-route-chart:
    enabled: true
    host: it-tools.schober.dev

