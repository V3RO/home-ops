apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-config
  namespace: {{ .Release.Namespace }}
data:
  config.yml: |
    sonarr:
      instance1:
        base_url: {{ .Values.config.sonarr.baseUrl | quote }}
        api_key: !env SONARR_API_KEY
        quality_definition:
          type: series
        # Experimental: removes profiles no longer referenced in this config (e.g.
        # leftovers from renames) instead of leaving them as unused orphans.
        delete_unmanaged_quality_profiles:
          enabled: false
        include:
          - template: {{ .Values.config.sonarr.profile.trashId | quote }}
            source: TRASH
          - template: {{ .Values.config.sonarr.animeProfile.trashId | quote }}
            source: TRASH
        custom_format_groups:
          - trash_guide:
              - id: 7e1724c5da59e7474803ad25be98f6a3 # [HDR Formats] HDR
              - id: 7d366c213e5c23a052b157356fac1921 # [HDR Formats] HDR10+ Boost
            assign_scores_to:
              - name: {{ .Values.config.sonarr.profile.name | quote }}
          - trash_guide:
              - id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
            assign_scores_to:
              - name: {{ .Values.config.sonarr.profile.name | quote }}
                score: -10000
          - trash_guide:
              - id: 4b196eed652c65ea98d615212040ebe2 # [Required] Anime Versions/Repacks
              - id: f206572b1147d0221bb1c96765b349e8 # [Release Groups] Anime (BD/WEB tiers, raws, LQ groups)
            assign_scores_to:
              - name: {{ .Values.config.sonarr.animeProfile.name | quote }}
        cloneQualityProfiles:
          - from: {{ .Values.config.sonarr.profile.name | quote }}
            to: {{ .Values.config.sonarr.germanProfile.name | quote }}
        custom_formats:
          - trash_ids:
              # Same-tier tie-breaker only: quality (resolution/source) always outranks
              # custom format score in Sonarr, so this can never cause a German dual-audio
              # release to upgrade over a higher-quality English-only one (e.g. 1080p -> 2160p).
              - ed51973a811f51985f14e2f6f290e47a # German DL
            assign_scores_to:
              - name: {{ .Values.config.sonarr.profile.name | quote }}
                score: 50
          - trash_ids:
              - 8a9fcdbb445f2add0505926df3bb7b8a # German
            assign_scores_to:
              - name: {{ .Values.config.sonarr.germanProfile.name | quote }}
                score: 10000
          - trash_ids:
              - ed51973a811f51985f14e2f6f290e47a # German DL
            assign_scores_to:
              - name: {{ .Values.config.sonarr.germanProfile.name | quote }}
                score: 11000
          - trash_ids:
              # Mild preference for dual-audio (JP+EN) releases, doesn't reject sub/dub-only
              - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
            assign_scores_to:
              - name: {{ .Values.config.sonarr.animeProfile.name | quote }}
                score: 10
        download_clients:
          data:
            - name: {{ .Values.config.sonarr.downloadClientName | quote }}
              type: qbittorrent
              enable: true
              priority: 1
              remove_completed_downloads: false
              remove_failed_downloads: false
              fields:
                host: {{ .Values.config.qbittorrent.host | quote }}
                port: {{ .Values.config.qbittorrent.port }}
                use_ssl: {{ .Values.config.qbittorrent.useSsl }}
                url_base: {{ .Values.config.qbittorrent.urlBase | quote }}
                api_key: !env QBITTORRENT_API_KEY
                tv_category: {{ .Values.config.sonarr.category | quote }}
          update_password: true
          delete_unmanaged:
            enabled: false
        root_folders:
          {{- range .Values.config.sonarr.rootFolders }}
          - {{ . | quote }}
          {{- end }}
    radarr:
      instance1:
        base_url: {{ .Values.config.radarr.baseUrl | quote }}
        api_key: !env RADARR_API_KEY
        quality_definition:
          type: movie
        # Experimental: removes profiles no longer referenced in this config (e.g.
        # leftovers from renames) instead of leaving them as unused orphans.
        delete_unmanaged_quality_profiles:
          enabled: false
        include:
          - template: {{ .Values.config.radarr.profile.trashId | quote }}
            source: TRASH
          - template: {{ .Values.config.radarr.hdProfile.trashId | quote }}
            source: TRASH
        custom_format_groups:
          - trash_guide:
              - id: ef20e67b95a381fb3bc6d1f06ea24f46 # [HDR Formats] HDR
              - id: b29413a7487478fe98228ce79e5689e4 # [HDR Formats] HDR10+ Boost
            assign_scores_to:
              - name: {{ .Values.config.radarr.profile.name | quote }}
              - name: {{ .Values.config.radarr.hdProfile.name | quote }}
          - trash_guide:
              # TV has no Dolby Vision support: reject DV releases without an HDR10 fallback layer
              - id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
            assign_scores_to:
              - name: {{ .Values.config.radarr.profile.name | quote }}
                score: -10000
              - name: {{ .Values.config.radarr.hdProfile.name | quote }}
                score: -10000
          - trash_guide:
              - id: 6ebc4bfba9721581d3e9e8994456e6f7 # [Required] Anime Versions/Repacks
              - id: 1f8404f7f72c7edc8901f2f3589d1a91 # [Release Groups] Anime (BD/WEB tiers, raws, LQ groups)
            assign_scores_to:
              - name: {{ .Values.config.radarr.animeProfile.name | quote }}
        cloneQualityProfiles:
          - from: {{ .Values.config.radarr.profile.name | quote }}
            to: {{ .Values.config.radarr.germanProfile.name | quote }}
          - from: {{ .Values.config.radarr.profile.name | quote }}
            to: {{ .Values.config.radarr.animeProfile.name | quote }}
        custom_formats:
          - trash_ids:
              # Same-tier tie-breaker only: quality (resolution/source) always outranks
              # custom format score in Radarr, so this can never cause a German dual-audio
              # release to upgrade over a higher-quality English-only one (e.g. WEB -> Bluray).
              - f845be10da4f442654c13e1f2c3d6cd5 # German DL
            assign_scores_to:
              - name: {{ .Values.config.radarr.profile.name | quote }}
                score: 50
              - name: {{ .Values.config.radarr.hdProfile.name | quote }}
                score: 50
          - trash_ids:
              - 86bc3115eb4e9873ac96904a4a68e19e # German
            assign_scores_to:
              - name: {{ .Values.config.radarr.germanProfile.name | quote }}
                score: 10000
          - trash_ids:
              - f845be10da4f442654c13e1f2c3d6cd5 # German DL
            assign_scores_to:
              - name: {{ .Values.config.radarr.germanProfile.name | quote }}
                score: 11000
          - trash_ids:
              # Mild preference for dual-audio (JP+EN) releases, doesn't reject sub/dub-only
              - 4a3b087eea2ce012fcc1ce319259a3be # Anime Dual Audio
            assign_scores_to:
              - name: {{ .Values.config.radarr.animeProfile.name | quote }}
                score: 10
        download_clients:
          data:
            - name: {{ .Values.config.radarr.downloadClientName | quote }}
              type: qbittorrent
              enable: true
              priority: 1
              remove_completed_downloads: false
              remove_failed_downloads: false
              fields:
                host: {{ .Values.config.qbittorrent.host | quote }}
                port: {{ .Values.config.qbittorrent.port }}
                use_ssl: {{ .Values.config.qbittorrent.useSsl }}
                url_base: {{ .Values.config.qbittorrent.urlBase | quote }}
                api_key: !env QBITTORRENT_API_KEY
                movie_category: {{ .Values.config.radarr.category | quote }}
          update_password: true
          delete_unmanaged:
            enabled: false
        root_folders:
          {{- range .Values.config.radarr.rootFolders }}
          - {{ . | quote }}
          {{- end }}
    # Chaptarr is a Readarr fork and speaks the same v1 API for download
    # clients. Root folders are intentionally not managed here: Chaptarr uses
    # per-media quality/metadata profile IDs and a folderType, which configarr's
    # Readarr root-folder sync does not understand. Add them in the UI.
    readarr:
      chaptarr:
        base_url: {{ .Values.config.chaptarr.baseUrl | quote }}
        api_key: !env CHAPTARR_API_KEY
        download_clients:
          data:
            - name: {{ .Values.config.chaptarr.downloadClientName | quote }}
              type: qbittorrent
              enable: true
              priority: 1
              remove_completed_downloads: false
              remove_failed_downloads: false
              fields:
                host: {{ .Values.config.qbittorrent.host | quote }}
                port: {{ .Values.config.qbittorrent.port }}
                use_ssl: {{ .Values.config.qbittorrent.useSsl }}
                url_base: {{ .Values.config.qbittorrent.urlBase | quote }}
                api_key: !env QBITTORRENT_API_KEY
                audiobook_category: {{ .Values.config.chaptarr.category | quote }}
                ebook_category: {{ .Values.config.chaptarr.category | quote }}
          update_password: true
          delete_unmanaged:
            enabled: false
    # Prowlarr pushes its indexers to every application listed here: Sonarr and
    # Radarr use their native application types, Chaptarr uses the Readarr type.
    # delete_unmanaged stays disabled so apps added manually in the UI survive.
    prowlarr:
      main:
        base_url: {{ .Values.config.prowlarr.baseUrl | quote }}
        api_key: !env PROWLARR_API_KEY
        applications:
          data:
            # Existing manual app entries are now adopted by configarr. The
            # category lists match what was configured in Prowlarr; without
            # them a full update would reset the apps to Prowlarr's defaults.
            - name: {{ .Values.config.prowlarr.sonarrApplicationName | quote }}
              type: Sonarr
              sync_level: fullSync
              fields:
                prowlarrUrl: {{ printf "%s:80" .Values.config.prowlarr.baseUrl | quote }}
                baseUrl: {{ printf "%s:80" .Values.config.sonarr.baseUrl | quote }}
                apiKey: !env SONARR_API_KEY
                syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
                animeSyncCategories: [5070]
                syncAnimeStandardFormatSearch: true
                syncRejectBlocklistedTorrentHashesWhileGrabbing: false
            - name: {{ .Values.config.prowlarr.radarrApplicationName | quote }}
              type: Radarr
              sync_level: fullSync
              fields:
                prowlarrUrl: {{ printf "%s:80" .Values.config.prowlarr.baseUrl | quote }}
                baseUrl: {{ printf "%s:80" .Values.config.radarr.baseUrl | quote }}
                apiKey: !env RADARR_API_KEY
                syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
                syncRejectBlocklistedTorrentHashesWhileGrabbing: false
            - name: {{ .Values.config.prowlarr.chaptarrApplicationName | quote }}
              type: {{ .Values.config.prowlarr.chaptarrApplicationType | quote }}
              sync_level: fullSync
              fields:
                prowlarrUrl: {{ printf "%s:80" .Values.config.prowlarr.baseUrl | quote }}
                baseUrl: {{ printf "%s:80" .Values.config.chaptarr.baseUrl | quote }}
                apiKey: !env CHAPTARR_API_KEY
          delete_unmanaged:
            enabled: false
          # Trigger Prowlarr's "Sync App Indexers" immediately so Chaptarr gets
          # the current indexer set on the next configarr run.
          sync_indexers: true
