apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: sonarr-db-password
  namespace: {{ .Release.Namespace }}
spec:
  length: 42
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-db-generated
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: sonarr-db-generated
    template:
      engineVersion: v2
      data:
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: sonarr-db-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sonarr-db-push
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: bitwarden-cnpg-secrets
      kind: ClusterSecretStore
  selector:
    secret:
      name: sonarr-db-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: {{ .Values.externalSecret.keys.cnpgPassword | quote }}
