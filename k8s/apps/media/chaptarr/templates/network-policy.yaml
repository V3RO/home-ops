{{- if (default false .Values.networkPolicy.enabled) }}
{{- /* Chaptarr's HTTP port, as configured under home-ops-app-chart.ports in
       values.yaml. It cannot be read from here: a subchart only sees its own
       values. */}}
{{- $port := 8789 }}
---
# Ingress: the internal ingress gateway (OIDC is handled by Chaptarr itself),
# Prowlarr (pushes indexers through the Readarr application API) and configarr
# (manages the qBittorrent download client).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chaptarr-allow-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chaptarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress-internal
      ports:
        - protocol: TCP
          port: {{ $port }}
    - from:
        - podSelector:
            matchLabels:
              app: prowlarr
        - podSelector:
            matchLabels:
              app: configarr
      ports:
        - protocol: TCP
          port: {{ $port }}
---
# Egress: the OIDC issuer. Chaptarr resolves https://auth.schober.dev from
# inside the pod and that name resolves to the public entry point, so the
# namespace-scoped default-deny alone is not enough: without the 443 rule the
# discovery call fails with a 60s HttpClient timeout.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chaptarr-allow-egress-authentik
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chaptarr
  policyTypes:
    - Egress
  egress:
    # OIDC discovery, token and userinfo endpoints over the public entry point.
    - ports:
        - protocol: TCP
          port: 443
    # The authentik namespace directly, for anything that resolves to a
    # ClusterIP instead of the public address.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
{{- end }}
