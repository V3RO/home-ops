{{- if (default false .Values.networkPolicy.enabled) }}
{{- /* Shoko's HTTP port. It cannot be read from home-ops-app-chart's values:
       a subchart only sees its own. */}}
{{- $port := 8111 }}
---
# Ingress: the internal gateway only, plus Jellyfin for the Shokofin plugin.
# Shokofin does all of its Shoko traffic -- REST, SignalR and the image bytes it
# proxies through its own anonymous Shokofin/Host route -- from inside the
# jellyfin pod, so this rule is what the whole integration runs on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shoko-allow-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shoko
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress-internal
      ports:
        - protocol: TCP
          port: {{ $port }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jellyfin
      ports:
        - protocol: TCP
          port: {{ $port }}
---
# Egress: AniDB (HTTP API + UDP API), TMDb, Sentry, GitHub plugin feed.
# DNS (53) and intra-namespace traffic already come from the namespace-wide
# default-deny-egress in qbittorrent/templates/network-policy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shoko-allow-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shoko
  policyTypes:
    - Egress
  egress:
    - ports:
        # AniDB HTTP API. This is NOT on port 80/443: AniDbSettings.HTTPServerUrl
        # defaults to http://api.anidb.net:9001, i.e. plain HTTP over TCP 9001.
        # Without this rule the import still recognises files over the UDP API but
        # every GetAniDBAnimeJob fails in AniDB.HTTP.HttpRequest.Send(), so no
        # series or file entries are ever created and the collection stays empty.
        - protocol: TCP
          port: 9001
        # AniDB UDP API (UDPServerPort 9000) -- used for file/hash lookups.
        - protocol: UDP
          port: 9000
        # TMDb, AniDB images, Sentry, GitHub plugin feed.
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
{{- end }}
