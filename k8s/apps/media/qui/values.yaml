home-ops-app-chart:
  image:
    repository: ghcr.io/autobrr/qui
    tag: v1.30.0
    pullPolicy: IfNotPresent

  strategy:
    type: Recreate

  ports:
    - name: http
      containerPort: 7476
      protocol: TCP

  env:
    # The entrypoint chowns /config for PUID:PGID and then drops privileges.
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: TZ
      value: Europe/Vienna
    # Native OIDC against Authentik. qui refuses to start when the issuer is
    # unreachable, so the Authentik provider (blueprint-qui) must exist first.
    - name: QUI__OIDC_ENABLED
      value: "true"
    - name: QUI__OIDC_ISSUER
      value: "https://auth.schober.dev/application/o/qui/"
    - name: QUI__OIDC_CLIENT_ID
      value: "qui"
    - name: QUI__OIDC_REDIRECT_URL
      value: "https://qui.schober.dev/api/auth/oidc/callback"
    - name: QUI__OIDC_DISABLE_BUILT_IN_LOGIN
      value: "true"
    - name: QUI__SESSION_COOKIE_SECURE
      value: "true"
    - name: QUI__ALLOWED_HOSTS
      value: "qui.schober.dev,localhost"
    - name: QUI__CHECK_FOR_UPDATES
      value: "false"
    - name: QUI__LOG_LEVEL
      value: "INFO"
    # Postgres, not qui's default SQLite. discrete settings rather than a DSN so
    # the generated password never has to be URL-encoded; the value itself
    # arrives through QUI__DATABASE_PASSWORD_FILE (see extraVolumeMounts below),
    # which qui also reads at a higher precedence than QUI__DATABASE_PASSWORD.
    - name: QUI__DATABASE_ENGINE
      value: postgres
    - name: QUI__DATABASE_HOST
      value: qui-postgres-rw.media.svc.cluster.local
    - name: QUI__DATABASE_PORT
      value: "5432"
    - name: QUI__DATABASE_USER
      value: qui
    - name: QUI__DATABASE_NAME
      value: qui
    - name: QUI__DATABASE_SSL_MODE
      value: disable
    - name: QUI__DATABASE_PASSWORD_FILE
      value: /var/run/qui-db/password
    # QUI__OIDC_CLIENT_SECRET is injected by the externalSecrets entry below
    # (template key + injectAsEnv), so it never appears on the command line.

  # The CNPG credentials secret, mounted for the password file above. A plain
  # Secret volume rather than an ExternalSecret: Bitwarden already backs it
  # through the cnpg-qui-credentials ExternalSecret, so re-fetching it here
  # would only add a second copy that could drift.
  extraVolumes:
    - name: qui-db-credentials
      secret:
        secretName: cnpg-qui-credentials
  extraVolumeMounts:
    - name: qui-db-credentials
      mountPath: /var/run/qui-db
      readOnly: true

  # qui validates the Host header, and the kubelet sends the pod IP as Host
  # when it probes a pod directly. qui only auto-allows loopback plus its own
  # hostname, so both probes came back 400 and the liveness failure restarted
  # the container every ~45s. The Host header override below is what makes them
  # pass; keep it whenever an allowlist is set. (A missing Host on a TCP-connect
  # probe is not the same thing: qui answers 400, not 200.)
  livenessProbe:
    httpGet:
      path: /healthz/liveness
      port: http
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /healthz/readiness
      port: http
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  service:
    ports:
      - name: http
        port: 7476
        targetPort: http
        protocol: TCP

  home-ops-route-chart:
    enabled: true
    host: qui.schober.dev
    backend:
      port: 7476

  persistence:
    # No database here any more: state lives in the CNPG cluster below. This
    # only holds config.toml (including the session secret that protects stored
    # instance credentials), the tracker icon cache and qui's own backups.
    config:
      enabled: true
      storageClass: longhorn
      size: 2Gi
      mountPath: /config
    # Same RWX media volume qBittorrent and Jellyfin use. uid 1000 cannot write
    # /data/media (root-owned), so qui can read library files but not change
    # them; cross-seed link directories belong under /data (e.g. /data/cross-seed),
    # which is writable.
    data:
      enabled: true
      existingClaim: media-data
      mountPath: /data

  externalSecrets:
    oidc:
      enabled: true
      refreshInterval: 12h
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden-app-secrets
      data:
        - secretKey: secret
          remoteRef:
            key: authentik-qui-client-secret
      template:
        data:
          QUI__OIDC_CLIENT_SECRET: "{{ .secret }}"
      injectAsEnv: true

networkPolicy:
  enabled: true

# ──────────────────────────────────────────────
# Database (home-ops-cnpg-cluster-chart)
# ──────────────────────────────────────────────
# Same shape as sonarr/radarr/prowlarr/seerr: 3 instances, openebs-hostpath
# (node-local, and CNPG handles replication itself), barman-cloud backups to
# versitygw under the cluster's own prefix.
home-ops-cnpg-cluster-chart:
  enabled: true
  cluster:
    # 2Gi matches sonarr/radarr/prowlarr/seerr. qui's own state is small: the
    # instance list, licenses, torznab indexers, tracker/file caches.
    storage:
      size: 2Gi
      class: openebs-hostpath
  backup:
    # Existing clusters are staggered 03:05-03:50 (authentik 05, grafana 10,
    # immich 15, n8n 20, mealie 25, forgejo + netbird 30, prowlarr 35,
    # radarr 40, sonarr 45, seerr 50); 03:55 was the next free slot.
    schedule: "0 55 3 * * *"
    # qui's own versitygw account (versitygw cnpgClients) -- not the shared
    # root credentials.
    credentials:
      accessKeyIdRef: qui-backup-id
      secretAccessKeyRef: qui-backup-secret

