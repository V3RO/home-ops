{{- if (default false .Values.networkPolicy.enabled) }}
{{- /* qui's HTTP port, as configured under home-ops-app-chart.ports in values.yaml.
       It cannot be read from here: a subchart only sees its own values. */}}
{{- $port := 7476 }}
# Deliberately does not duplicate the namespace-wide policies from
# qbittorrent/templates/network-policy.yaml: default-deny-egress already allows
# DNS (53) and all intra-namespace traffic, which covers qui ->
# qbittorrent.media.svc.cluster.local:80.
---
# Ingress: only the internal ingress gateway reaches qui. There is no
# Authentik forward-auth in front of it, so /healthz/* and /api/auth/oidc/*
# stay reachable by design; the session is enforced by qui itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qui-allow-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress-internal
      ports:
        - protocol: TCP
          port: {{ $port }}
---
# Egress: Authentik. qui resolves https://auth.schober.dev from inside the pod,
# and that name resolves to the public address, not to the in-cluster Service
# (authentik is published through the external kgateway, and the internal
# gateway does not serve that hostname). So the namespace-scoped rule alone is
# not enough: without the 443 rule the OIDC discovery call fails with
# "dial tcp <public ip>:443: i/o timeout" and qui never becomes ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qui-allow-egress-authentik
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qui
  policyTypes:
    - Egress
  egress:
    # issuer/OIDC endpoints reached over the public entry point
    - ports:
        - protocol: TCP
          port: 443
    # the authentik namespace directly (Service on 9000), for anything that
    # resolves to a ClusterIP instead
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 9000
{{- end }}
