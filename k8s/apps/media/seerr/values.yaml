# --- Official seerr-chart values (dependency, aliased to `seerr`) ---
seerr:
  fullnameOverride: seerr
  image:
    tag: "" # defaults to the chart appVersion (currently v3.4.0)
  service:
    type: ClusterIP
    port: 80
  extraEnv:
    - name: TZ
      value: Europe/Vienna
    - name: DB_TYPE
      value: postgres
    - name: DB_HOST
      value: seerr-postgres-rw.media.svc.cluster.local
    - name: DB_PORT
      value: "5432"
    - name: DB_USER
      value: seerr
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: cnpg-seerr-credentials
          key: password
    - name: DB_NAME
      value: seerr
  config:
    persistence:
      # Only holds logs/cache once DB_TYPE=postgres — rebuild from scratch is fine.
      size: 2Gi
      name: seerr-config
      storageClass: longhorn

# --- Custom template values (platform integration) ---

postgres:
  clusterName: seerr-postgres
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  storage:
    class: openebs-hostpath
    size: 2Gi
  database: seerr
  owner: seerr
  # One-shot cluster-rebuild toggle: set true BEFORE first apply so the cluster
  # bootstraps from the barman-cloud backup in versitygw instead of initdb.
  # Flip back to false once the restored cluster is healthy.
  restore:
    enabled: false

app:
  host: seerr.schober.dev
  gateway:
    name: internal-gateway
    namespace: istio-ingress-internal
    sectionName: https
  backendServiceName: seerr
  servicePort: 80
  authentik:
    enabled: true
    outpostService:
      name: ak-outpost-proxy
      namespace: authentik
      port: 9000
    extAuth:
      pathPrefix: /outpost.goauthentik.io/auth/envoy
      headersToForward:
        - cookie
      headersToBackend:
        - set-cookie
        - x-authentik-username
        - x-authentik-groups
        - x-authentik-entitlements
        - x-authentik-email
        - x-authentik-name
        - x-authentik-uid
        - x-authentik-jwt
        - x-authentik-meta-jwks
        - x-authentik-meta-outpost
        - x-authentik-meta-provider
        - x-authentik-meta-app
        - x-authentik-meta-version
      headersToClientOnSuccess:
        - cookie

networkPolicy:
  enabled: true

externalSecret:
  enabled: true
  refreshInterval: 1h0m0s
  # Bitwarden entry holding the postgres password for the seerr role —
  # auto-created by the PushSecret in db-password.yaml (IfNotExists, so it
  # never overwrites the value a restored database expects).
  cnpgPasswordKey: seerr-db-secret
