{{- if .Values.externalSecret.enabled }}
# CNPG database password (Bitwarden-backed for restore safety)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-seerr-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: bitwarden-cnpg-secrets
    kind: ClusterSecretStore
  target:
    name: cnpg-seerr-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.owner }}
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.cnpgPasswordKey | quote }}
{{- end }}
