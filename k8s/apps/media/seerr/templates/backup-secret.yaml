apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-seerr-backup-credentials
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: bitwarden-cnpg-secrets
    kind: ClusterSecretStore
  target:
    name: cnpg-seerr-backup-credentials
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ `{{ .versitygw_access_key_id }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .versitygw_secret_access_key }}` }}"
  data:
    # seerr's own versitygw account (created by versitygw's
    # cnpg-client-credentials.yaml from the cnpgClients list; see
    # k8s/infra/versitygw/versitygw/BOOTSTRAP.md) — not the shared root
    # credentials.
    - secretKey: versitygw_access_key_id
      remoteRef:
        key: seerr-backup-id
    - secretKey: versitygw_secret_access_key
      remoteRef:
        key: seerr-backup-secret
