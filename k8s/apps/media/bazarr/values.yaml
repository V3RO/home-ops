home-ops-app-chart:
  image:
    repository: lscr.io/linuxserver/bazarr
    tag: "1.6.2"
    pullPolicy: IfNotPresent

  strategy:
    type: Recreate

  podSecurityContext:
    fsGroup: 1000

  ports:
    - name: http
      containerPort: 6767
      protocol: TCP

  env:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: TZ
      value: Europe/Vienna
    - name: HTTP_PROXY
      value: http://gluetun-proxy.media.svc.cluster.local:8888
    - name: HTTPS_PROXY
      value: http://gluetun-proxy.media.svc.cluster.local:8888
    - name: NO_PROXY
      value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local
    - name: http_proxy
      value: http://gluetun-proxy.media.svc.cluster.local:8888
    - name: https_proxy
      value: http://gluetun-proxy.media.svc.cluster.local:8888
    - name: no_proxy
      value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local

  initContainers:
    - name: seed-config
      image: busybox:1.38
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      command:
        - sh
        - -c
      args:
        - |
          CONFIG=/config/config/config.yaml
          if [ -s "$CONFIG" ]; then
            exit 0
          fi
          mkdir -p "$(dirname "$CONFIG")"
          cat > "$CONFIG" <<EOF
          general:
            use_sonarr: true
            use_radarr: true
          sonarr:
            ip: sonarr.media.svc.cluster.local
            port: 80
            base_url: /
            ssl: false
            apikey: "${SONARR_API_KEY}"
          radarr:
            ip: radarr.media.svc.cluster.local
            port: 80
            base_url: /
            ssl: false
            apikey: "${RADARR_API_KEY}"
          EOF
      envFrom:
        - secretRef:
            name: bazarr-arr-api-keys
      volumeMounts:
        - name: config
          mountPath: /config

  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 30
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 5

  service:
    ports:
      - name: http
        port: 80
        targetPort: http
        protocol: TCP

  persistence:
    config:
      enabled: true
      storageClass: longhorn
      size: 2Gi
      mountPath: /config
    data:
      enabled: true
      existingClaim: media-data
      mountPath: /data

  externalSecrets:
    arr-api-keys:
      enabled: true
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden-app-secrets
      data:
        - secretKey: SONARR_API_KEY
          remoteRef:
            key: sonarr-api-key
        - secretKey: RADARR_API_KEY
          remoteRef:
            key: radarr-api-key
      injectAsEnv: true

  home-ops-route-chart:
    enabled: true
    host: bazarr.schober.dev
    backend:
      port: 80
    authentik:
      enabled: true
