{{- if .Values.networkPolicy.enabled }}
# Hostname-based egress requires Cilium (the cluster's CNI), hence a
# CiliumNetworkPolicy rather than a vanilla NetworkPolicy. The default is
# deny: the agent can reach Forgejo, its model providers, package registries
# and the Kubernetes API (for read-only triage), and nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencode
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    # kubelet probes and any host-network traffic.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4096"
              protocol: TCP
    # The internal Gateway (kgateway data plane / Istio ambient) is the only
    # in-cluster client. No other pod may reach the OpenCode API directly.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-ingress-internal
        - matchLabels:
            io.kubernetes.pod.namespace: kgateway-system
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
      toPorts:
        - ports:
            - port: "4096"
              protocol: TCP
  egress:
    # Cluster DNS. Add node-local-dns if you deploy it later.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # kubectl in the ops-triage agent. RBAC limits it to read-only pod/event
    # access; NetworkPolicy only decides that the API server is reachable.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            # 443 covers the in-cluster kubernetes.default.svc; 6443 covers
            # the host API endpoint after DNAT.
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Model providers and package/tooling registries.
    # git.schober.dev is intentionally absent: it resolves to the
    # istio-ingress-internal Gateway VIP and pod-originated traffic to that
    # VIP is dropped, so an FQDN allow would look correct and still hang.
    # Forgejo is reached via its Service instead; see the last rule.
    - toFQDNs:
        - matchName: api.deepseek.com
        - matchName: api.moonshot.ai
        - matchName: api.moonshot.cn
        - matchName: models.dev
        - matchName: dl-cdn.alpinelinux.org
        - matchName: registry.npmjs.org
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: proxy.golang.org
        - matchName: sum.golang.org
        - matchName: storage.googleapis.com
        - matchName: crates.io
        - matchName: static.crates.io
        - matchName: index.crates.io
        - matchName: rubygems.org
        - matchName: index.rubygems.org
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: raw.githubusercontent.com
        - matchName: objects.githubusercontent.com
        - matchName: deb.debian.org
        - matchName: security.debian.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Forgejo, pinned to the Service rather than to the namespace. The old
    # rule was already limited to port 3000, but it allowed every pod in the
    # forgejo namespace on that port, including ones added later. Naming the
    # Service keeps the grant to the HTTP endpoint git and the Forgejo API use.
    #
    # Cilium renamed this API: `kubeService`/`name` became
    # `k8sService`/`serviceName`. The CRD schema rejects the old spelling
    # outright, so the policy below is invalid and never applies.
    - toServices:
        - k8sService:
            namespace: {{ .Values.networkPolicy.forgejo.namespace }}
            serviceName: {{ .Values.networkPolicy.forgejo.service }}
      toPorts:
        - ports:
            - port: "{{ .Values.networkPolicy.forgejo.port }}"
              protocol: TCP
{{- end }}
