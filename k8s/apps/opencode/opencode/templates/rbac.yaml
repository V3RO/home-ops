{{- if .Values.rbac.enabled }}
{{- $app := index .Values "home-ops-app-chart" }}
# Read-only access for the ops-triage agent. Deliberately excludes Secrets,
# ConfigMaps and all write verbs: a compromised agent can read pod logs and
# workload status, but cannot read credentials or change the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencode-log-reader
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
  # Read-only access to network policies so the agent can verify the effect of
  # a CiliumNetworkPolicy change. Without this, a policy that fails schema
  # validation silently leaves the previous one in place and the agent cannot
  # see it. Still no write verbs, and no Secrets.
  - apiGroups:
      - cilium.io
    resources:
      - ciliumnetworkpolicies
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-log-reader
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencode-log-reader
subjects:
  - kind: ServiceAccount
    name: {{ $app.serviceAccount.name | default "opencode" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
