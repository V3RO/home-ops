{{- $app := index .Values "home-ops-app-chart" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $app.serviceAccount.name | default "opencode" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
# The ops-triage agent uses this token for read-only kubectl access. If you
# disable rbac.enabled, this also turns off the mounted token.
automountServiceAccountToken: {{ .Values.rbac.enabled }}
