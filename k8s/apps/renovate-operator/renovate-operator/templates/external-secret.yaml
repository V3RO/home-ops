apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: renovate-secret
    template:
      type: Opaque
      data:
        RENOVATE_TOKEN: "{{`{{ .forgejoToken }}`}}"
        GITHUB_COM_TOKEN: "{{`{{ .githubToken }}`}}"
        # Internal hosts resolve to cluster/LAN IPs, which Renovate blocks unless allowInternal is set.
        RENOVATE_HOST_RULES: |-
          [
            {"matchHost": "git.schober.dev", "allowInternal": true},
            {"matchHost": "zot.schober.dev", "allowInternal": true}
          ]
  data:
    - secretKey: forgejoToken
      remoteRef:
        key: {{ .Values.externalSecret.keys.forgejoToken }}
    - secretKey: githubToken
      remoteRef:
        key: {{ .Values.externalSecret.keys.githubToken }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: renovate-oidc
    template:
      type: Opaque
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.externalSecret.keys.oidcClientSecret }}
    - secretKey: session-secret
      remoteRef:
        key: {{ .Values.externalSecret.keys.sessionSecret }}
