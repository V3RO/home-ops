apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: renovate-secret
    template:
      type: Opaque
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.keys.forgejoToken }}
    - secretKey: GITHUB_COM_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.keys.githubToken }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: renovate-oidc
    template:
      type: Opaque
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.externalSecret.keys.oidcClientSecret }}
    - secretKey: session-secret
      remoteRef:
        key: {{ .Values.externalSecret.keys.sessionSecret }}
