apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-vanilla-s3-credentials
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  target:
    name: minecraft-vanilla-s3-credentials
    template:
      engineVersion: v2
      data:
        access-key: "{{ `{{ .access_key }}` }}"
        secret-key: "{{ `{{ .secret_key }}` }}"
  data:
    # Written by the VersityGW chart's PushSecret for the `minecraft` data
    # client (k8s/infra/versitygw/versitygw/templates/data-client-credentials.yaml).
    # The S3 *account* stays `minecraft`, not `minecraft-vanilla`: it is shared
    # by every Minecraft server in this namespace.
    - secretKey: access_key
      remoteRef:
        key: minecraft-id
    - secretKey: secret_key
      remoteRef:
        key: minecraft-secret
