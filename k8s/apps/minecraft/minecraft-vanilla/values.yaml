# Vanilla (Fabric) Minecraft server.
#
# Everything lives under the `minecraft` key because this wrapper chart's only
# dependency is the HelmForge chart of the same name.
#
# Design rationale (storage class, sizing, no auto-scaling, why both
# `existingSecret` keys are load-bearing) is in MINECRAFT_SELF_HOSTING_PLAN.md.

minecraft:
  # Keeps the Deployment, Service and PVC named "minecraft-vanilla". The Argo
  # Application and the Helm release name come from the directory name
  # (k8s/apps/minecraft/minecraft-vanilla), so all four agree.
  fullnameOverride: minecraft-vanilla

  image:
    # Java major must match the game version, and it is a hard requirement, not
    # a preference: 26.x reports javaVersion.majorVersion=25 in its version
    # metadata, and the server refuses to start on 21.
    #
    #   <= 1.21.x  ->  -java21
    #   26.x       ->  -java25
    #
    # Pin, never float.
    tag: 2026.9.2-java25

  server:
    eula: true
    # The release name is independent of the TYPE, so switching loaders
    # does not rename anything. The world is vanilla-format and survives a
    # loader swap as long as no mod added custom blocks/items to it.
    type: FABRIC
    version: "26.3"
    motd: "schober.dev vanilla"
    maxPlayers: 15
    viewDistance: 10
    simulationDistance: 6
    difficulty: hard
    gameMode: survival

    # Consumed by the itzg image together with MODRINTH_PROJECTS below.
    extraEnv:
      - name: MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE
        value: release
      # tree-harvester (and friends) refuse to run without Collective, and the
      # default download mode is `none`.
      - name: MODRINTH_DOWNLOAD_DEPENDENCIES
        value: required

  mods:
    # Performance mods, installed at startup by the itzg image from Modrinth.
    # The jars land in /data/mods (local PVC) and are excluded from backups, so
    # this pinned list -- not the PVC -- is the source of truth.
    #
    #   ?         optional: with no compatible build, warn and boot anyway
    #             instead of failing the whole startup.
    #   :version  pinned by version NUMBER, not ID: an ID overrides the loader
    #             and Minecraft compatibility checks, a number does not.
    # All mods resolve against the fabric loader natively -- no prefixes
    # needed under TYPE=FABRIC. FerriteCore's 26.3 tag is an unproven forward
    # declaration (published on the 26.1 release day while declaring 26.1-
    # 26.3); the `?` covers only a failed lookup, not a runtime failure, so
    # drop the entry if the server misbehaves. Snow Under Trees stays out:
    # both variants call chunk-future APIs that Moonrise's rewritten chunk
    # system rejects (crash on join).
    # Literal block on purpose: the itzg image accepts MODRINTH_PROJECTS as a
    # comma OR newline separated list, so one entry per line works and keeps
    # this list easy to extend. NOTE: comments are NOT allowed inside the
    # block -- every line, including `#` lines, is passed to the image.
    #
    #   No 26.3 build  lazydfu, modernfix -> `?` makes the lookup warn and
    #                  skip (checked 2026-10). LazyDFU is redundant anyway:
    #                  DFU is lazy in vanilla since 1.19.4.
    #   Alpha only     slabbed is pinned to its 26.3 alpha, since the
    #                  default version type (release) would skip it. Unpin
    #                  once a 26.3 release exists.
    #   Retest         xaeros-world-map threw unknown-registry-key sync
    #                  errors under Quilt; re-testing under Fabric. Drop it
    #                  again if they reappear.
    #   Datapacks      veinminer, veinminer-enchantment (needs veinminer)
    modrinthProjects: |
      lithium?:mc26.3-0.26.2-fabric
      ferrite-core?:9.0.0-fabric
      moonrise-opt:1.2.0+61c1328
      clumps:26.3.2
      lazydfu?
      modernfix?
      tree-harvester
      appleskin:3.0.10+mc26.3
      jade
      slabbed?:0.6.4-alpha+26.2-26.3
      blackwolf-library
      more-beautiful-slabs
      more-beautiful-vertical-slabs
      more-beautiful-stairs
      more-beautiful-walls
      datapack:veinminer
      datapack:veinminer-enchantment
      

  jvm:
    initMemory: 6G
    maxMemory: 9G
    useAikarFlags: true

  auth:
    onlineMode: true
    enforceWhitelist: false
    whitelist: ""
    ops: ""

  rcon:
    enabled: true
    existingSecret: minecraft-vanilla-rcon
    serviceEnabled: false

  persistence:
    enabled: true
    storageClass: openebs-hostpath
    size: 20Gi

  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 10Gi

  metrics:
    enabled: true
    serviceMonitor:
      # This cluster has no Prometheus Operator, so the CR would break the sync.
      enabled: false

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

  service:
    type: ClusterIP
    annotations:
      mc-router.itzg.me/externalServerName: "vanilla.minecraft.schober.dev"

  backup:
    enabled: true
    schedule: "0 4 * * *"
    archivePrefix: minecraft-vanilla
    excludes: "*.jar cache logs"
    concurrencyPolicy: Forbid
    suspend: false
    s3:
      endpoint: "http://versitygw.versitygw.svc.cluster.local:7070"
      bucket: "minecraft-backups"
      prefix: "minecraft-vanilla"
      createBucketIfNotExists: false
      existingSecret: minecraft-vanilla-s3-credentials
    images:
      worker: docker.io/itzg/minecraft-server:2026.9.2
      uploader: docker.io/helmforge/mc:1.0.0

  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      name: bitwarden-app-secrets
      kind: ClusterSecretStore
    data:
      - secretKey: rcon-password
        remoteRef:
          key: minecraft-rcon-secret

minecraft-exporter:
  fullnameOverride: minecraft-vanilla-exporter
  options:
    - --mc.rcon-address=minecraft-vanilla:25575
    - --mc.world=/data/world
    - --mc.name-source=mojang
    - --mc.mod-server-stats=fabric
  extraEnv:
    - name: MC_RCON_PASSWORD
      valueFrom:
        secretKeyRef:
          name: minecraft-vanilla-rcon
          key: rcon-password
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9150"
    prometheus.io/path: /metrics
  # Match the server's UID/GID so the world files are readable.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  # The world PVC is ReadWriteOnce hostpath, so the exporter must run on the
  # server's node to mount it.
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: minecraft-vanilla
              app.kubernetes.io/component: server
  extraVolumes:
    - name: data
      persistentVolumeClaim:
        claimName: minecraft-vanilla
        readOnly: true
  extraVolumeMounts:
    - name: data
      mountPath: /data
      readOnly: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
