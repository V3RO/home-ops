# Vanilla (Quilt) Minecraft server.
#
# Everything lives under the `minecraft` key because this wrapper chart's only
# dependency is the HelmForge chart of the same name.
#
# Design rationale (storage class, sizing, no auto-scaling, why both
# `existingSecret` keys are load-bearing) is in MINECRAFT_SELF_HOSTING_PLAN.md.

minecraft:
  # Keeps the Deployment, Service and PVC named "minecraft-vanilla". The Argo
  # Application and the Helm release name come from the directory name
  # (k8s/apps/minecraft/minecraft-vanilla), so all four agree.
  fullnameOverride: minecraft-vanilla

  image:
    # Java major must match the game version, and it is a hard requirement, not
    # a preference: 26.x reports javaVersion.majorVersion=25 in its version
    # metadata, and the server refuses to start on 21.
    #
    #   <= 1.21.x  ->  -java21
    #   26.x       ->  -java25
    #
    # Pin, never float.
    tag: 2026.9.2-java25

  server:
    eula: true
    # The server TYPE is Quilt; the release name is independent of it, so
    # changing the type later does not rename anything.
    type: QUILT
    version: "26.3"
    motd: "schober.dev vanilla"
    maxPlayers: 15
    viewDistance: 8
    simulationDistance: 6
    difficulty: normal
    gameMode: survival

    # Consumed by the itzg image together with MODRINTH_PROJECTS below.
    extraEnv:
      - name: MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE
        value: release
      # tree-harvester (and friends) refuse to run without Collective, and the
      # default download mode is `none`.
      - name: MODRINTH_DOWNLOAD_DEPENDENCIES
        value: required

  mods:
    # Performance mods, installed at startup by the itzg image from Modrinth.
    # The jars land in /data/mods (local PVC) and are excluded from backups, so
    # this pinned list -- not the PVC -- is the source of truth.
    #
    #   ?         optional: with no compatible build, warn and boot anyway
    #             instead of failing the whole startup.
    #   fabric:   needed for mods not tagged with the quilt loader, or the
    #             Modrinth lookup returns nothing at all.
    #   :version  pinned by version NUMBER, not ID: an ID overrides the loader
    #             and Minecraft compatibility checks, a number does not.
    # Lithium is tagged fabric+quilt and resolves on its own. FerriteCore is
    # tagged fabric ONLY, so a quilt-filtered lookup returns nothing for it --
    # hence the explicit `fabric:` prefix, which overrides the loader filter.
    # Its 26.3 tag is still the unproven one: published 2026-03-24 (the 26.1
    # release day) while declaring 26.1-26.3, so it is a forward declaration
    # rather than a build tested against 26.3. The `?` only covers a failed
    # lookup, not a runtime failure -- if the server misbehaves, drop this entry.
    # Literal block on purpose: the itzg image accepts MODRINTH_PROJECTS as a
    # comma OR newline separated list, so one entry per line works and keeps
    # this list easy to extend. NOTE: comments are NOT allowed inside the
    # block -- every line, including `#` lines, is passed to the image.
    #
    # Grouping (plain text only, keep in sync when editing):
    #   Quilt-tagged   lithium, tree-harvester, jade, snow-under-trees
    #   Fabric-only    ferrite-core, appleskin, moonrise-opt, clumps
    #
    # snow-under-trees is bl4ckscor3's original, chosen over the
    # "remastered" fork because the remastered one's WorldTickHandler calls
    # ChunkHolder.getEntityTickingChunkFuture, which Moonrise's rewritten
    # chunk system deliberately throws UnsupportedOperationException for --
    # crashing the server on join. The original carries explicit Moonrise
    # compat (upstream commit b28d991).
    #   No 26.3 build  lazydfu, modernfix -> `?` makes the lookup warn and
    #                  skip (checked 2026-10). LazyDFU is redundant anyway:
    #                  DFU is lazy in vanilla since 1.19.4.
    #   Datapacks      veinminer, veinminer-enchantment (needs veinminer)
    modrinthProjects: |
      lithium?:mc26.3-0.26.2-fabric
      tree-harvester
      jade
      snow-under-trees
      fabric:ferrite-core?:9.0.0-fabric
      fabric:appleskin:3.0.10+mc26.3
      fabric:moonrise-opt:1.2.0+61c1328
      fabric:clumps:26.3.2
      fabric:lazydfu?
      fabric:modernfix?
      datapack:veinminer
      datapack:veinminer-enchantment

  jvm:
    memory: 6G
    initMemory: 6G
    useAikarFlags: true

  auth:
    onlineMode: true
    enforceWhitelist: false
    whitelist: ""
    ops: ""

  rcon:
    enabled: true
    existingSecret: minecraft-vanilla-rcon
    serviceEnabled: false

  persistence:
    enabled: true
    storageClass: openebs-hostpath
    size: 20Gi

  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 10Gi

  metrics:
    enabled: true
    serviceMonitor:
      # This cluster has no Prometheus Operator, so the CR would break the sync.
      enabled: false

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

  service:
    type: ClusterIP
    annotations:
      mc-router.itzg.me/externalServerName: "vanilla.minecraft.schober.dev"

  backup:
    enabled: true
    schedule: "0 4 * * *"
    archivePrefix: minecraft-vanilla
    excludes: "*.jar cache logs"
    concurrencyPolicy: Forbid
    suspend: false
    s3:
      endpoint: "http://versitygw.versitygw.svc.cluster.local:7070"
      bucket: "minecraft-backups"
      prefix: "minecraft-vanilla"
      createBucketIfNotExists: false
      existingSecret: minecraft-vanilla-s3-credentials
    images:
      worker: docker.io/itzg/minecraft-server:2026.9.2
      uploader: docker.io/helmforge/mc:1.0.0

  externalSecrets:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      name: bitwarden-app-secrets
      kind: ClusterSecretStore
    data:
      - secretKey: rcon-password
        remoteRef:
          key: minecraft-rcon-secret
