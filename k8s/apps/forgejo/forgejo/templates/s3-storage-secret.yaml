{{- if .Values.externalSecret.enabled }}
# Forgejo's versitygw account for PRIMARY object data (LFS, packages,
# attachments, Actions artifacts) -- a different account from
# cnpg-forgejo-backup-credentials, which only reaches the cnpg-backups
# bucket. Generated and pushed to Bitwarden by
# k8s/infra/versitygw/versitygw/templates/data-client-credentials.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-s3-storage
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: forgejo-s3-storage
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ `{{ .accessKeyId }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .secretAccessKey }}` }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: forgejo-data-id
    - secretKey: secretAccessKey
      remoteRef:
        key: forgejo-data-secret
{{- end }}
