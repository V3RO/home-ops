{{- $context := .Subcharts.forgejo -}}
{{- $fullName := include "gitea.fullname" $context -}}
{{- $tcpRoute := .Values.tcpRoute -}}
{{- if $tcpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: {{ $fullName }}-ssh
  namespace: {{ include "common.names.namespace" $context | quote }}
  labels:
    {{- include "gitea.labels" $context | nindent 4 }}
  {{- with $tcpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $tcpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - kind: Service
          name: {{ $fullName }}-ssh
          port: {{ $tcpRoute.port | default .Values.forgejo.service.ssh.port }}
{{- end }}
