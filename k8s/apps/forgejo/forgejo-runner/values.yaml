# Forgejo Act Runners Configuration

# Act Runner image settings
image:
  repository: code.forgejo.org/forgejo/runner
  tag: 13.1.0
  pullPolicy: IfNotPresent

# Number of runner replicas
replicaCount: 3

# Resource limits and requests
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

# Node affinity to spread runners across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - forgejo-runner
          topologyKey: kubernetes.io/hostname

# Runner configuration
runner:
  # Runner instance name
  name: "forgejo-runner"
  
  # Runner labels for workflow job routing
  # Can select runners in workflows with: runs-on: [label]
  labels:
    - "docker"
    - "helm"
    - "oci"
    - "ubuntu-latest"
  
  # Number of concurrent jobs per runner
  capacity: 10
  
  # Timeout for jobs (in seconds)
  timeout: 3600
  
  # Insecure TLS connections (only for testing/internal)
  insecure: false
  
  # Cache settings
  cache:
    enabled: true

# Forgejo instance settings
forgejo:
  # Forgejo API endpoint
  apiUrl: "http://forgejo-http.forgejo.svc.cluster.local:3000"
  
  # Runner token from Bitwarden (ExternalSecret will fetch this)
  tokenSecretName: "forgejo-runner-secret"
  tokenSecretKey: "token"
  
  # Runner UUID from Bitwarden (ExternalSecret will fetch this)
  uuidSecretName: "forgejo-runner-secret"
  uuidSecretKey: "uuid"

# Container runtime configuration for building images
container:
  # Docker-in-Docker mode
  dind:
    enabled: true
    image: docker:dind
    tag: "27-dind"
    storageDriver: "overlay2"
    # DinD resource limits
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "2000m"

# OCI Registry credentials (for pushing built images)
# These should be provided via environment variables or mounted secrets
ociRegistry:
  enabled: false
  # Registry URL (e.g., registry.example.com, ghcr.io, etc.)
  url: ""
  # Username from secret
  usernameSecretName: ""
  usernameSecretKey: "username"
  # Password/token from secret
  passwordSecretName: ""
  passwordSecretKey: "password"

# ServiceAccount configuration
serviceAccount:
  create: true
  name: "forgejo-runner"
  annotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: false
  runAsUser: 0

# Container security context
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - NET_ADMIN
      - SYS_ADMIN

# External Secrets configuration
externalSecret:
  enabled: true
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  # Keys in Bitwarden
  keys:
    uuid: forgejo-default-runner-uuid
    token: forgejo-default-runner-token

# Environment variables for the runner
env:
  # Log level: debug, info, warn, error
  LOG_LEVEL: "info"
  
  # Runner mode
  RUNNER_CONTAINER_PRIVILEGED_MODE: "false"
  
  # Timeout for network operations
  RUNNER_TIMEOUT: "3600"

# Volume mounts for configuration
volumeMounts:
  # Docker socket for DinD
  - name: docker-sock
    mountPath: /var/run/docker.sock
    readOnly: false
  # Runner config
  - name: runner-config
    mountPath: /etc/act
    readOnly: true

# Volumes
volumes:
  # DinD volume
  - name: docker-sock
    emptyDir: {}
  # Runner config from ConfigMap
  - name: runner-config
    configMap:
      name: forgejo-runner-config
      defaultMode: 0644
