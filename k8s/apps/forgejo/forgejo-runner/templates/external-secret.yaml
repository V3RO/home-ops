{{- if .Values.externalSecret.enabled }}
---
# forgejo-runner-init: contains CONFIG_INSTANCE, CONFIG_NAME, and CONFIG_TOKEN
# which the forgejo-runner chart's init container reads to register the runner
# with the Forgejo instance on first startup. Once the runner is registered,
# the .runner file is written to the PVC and the token is no longer needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-init
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: forgejo-runner-init
    template:
      data:
        CONFIG_INSTANCE: "https://git.schober.dev"
        CONFIG_NAME: "homelab-k8s"
        CONFIG_TOKEN: "{{ `{{ .runnerToken }}` }}"
  data:
    - secretKey: runnerToken
      remoteRef:
        key: {{ .Values.externalSecret.keys.runnerToken | quote }}
{{- end }}
