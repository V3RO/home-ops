home-ops-app-chart:
  image:
    repository: ghcr.io/toeverything/affine
    tag: "0.27.4"
    pullPolicy: IfNotPresent

  strategy:
    type: Recreate

  ports:
    - name: http
      containerPort: 3010
      protocol: TCP

  env:
    # The AFFiNE image does not set HOME, and self-host-predeploy.js resolves
    # the config directory via os.homedir(). Without this it tries to write
    # "/.affine/config" instead of "/root/.affine/config".
    - name: HOME
      value: /root
    - name: NODE_ENV
      value: production
    - name: DEPLOYMENT_TYPE
      value: selfhosted
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: affine-db-url
          key: DATABASE_URL
    - name: REDIS_SERVER_HOST
      value: valkey.valkey.svc.cluster.local
    - name: REDIS_SERVER_PORT
      value: "6379"
    - name: REDIS_SERVER_USERNAME
      value: default
    - name: REDIS_SERVER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: affine-valkey
          key: password
    # AFFiNE uses the configured database index and the next four. Forgejo
    # already owns 0-2, so 4-8 keeps AFFiNE isolated at the logical-DB level.
    - name: REDIS_SERVER_DATABASE
      value: "4"
    - name: AFFINE_INDEXER_ENABLED
      value: "false"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  livenessProbe:
    httpGet:
      path: /info
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /info
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  startupProbe:
    httpGet:
      path: /info
      port: http
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 5

  service:
    ports:
      - name: http
        port: 3010
        targetPort: http
        protocol: TCP

  extraVolumes:
    - name: config-template
      configMap:
        name: affine-config-template

  # Render config.json from the ConfigMap + Bitwarden-backed OIDC secret, then
  # run AFFiNE's pre-deploy migration before the server starts. The config PVC
  # also holds private.key, which must survive pod restarts.
  initContainers:
    - name: render-config
      image: busybox:1.36
      command:
        - sh
        - -c
      args:
        - >-
          sed "s|\${AFFINE_OIDC_CLIENT_SECRET}|${AFFINE_OIDC_CLIENT_SECRET}|g"
          /config-tpl/config.json.tpl > /config/config.json
      env:
        - name: AFFINE_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: affine-oidc
              key: clientSecret
      volumeMounts:
        - name: config
          mountPath: /config
        - name: config-template
          mountPath: /config-tpl
          readOnly: true

    - name: migrate
      image: ghcr.io/toeverything/affine:0.27.4
      command:
        - sh
        - -c
        - node ./scripts/self-host-predeploy.js
      env:
        - name: HOME
          value: /root
        - name: NODE_ENV
          value: production
        - name: DEPLOYMENT_TYPE
          value: selfhosted
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-db-url
              key: DATABASE_URL
        - name: REDIS_SERVER_HOST
          value: valkey.valkey.svc.cluster.local
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: REDIS_SERVER_USERNAME
          value: default
        - name: REDIS_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: affine-valkey
              key: password
        - name: REDIS_SERVER_DATABASE
          value: "4"
      volumeMounts:
        - name: storage
          mountPath: /root/.affine/storage
        - name: config
          mountPath: /root/.affine/config

  persistence:
    # Blob storage (attachments, avatars, document snapshots). Longhorn is
    # NVMe-backed here and replicated twice.
    storage:
      enabled: true
      storageClass: longhorn
      size: 20Gi
      mountPath: /root/.affine/storage
    # config.json and private.key. Losing private.key invalidates signed data
    # and sessions, so keep this on replicated storage rather than emptyDir.
    config:
      enabled: true
      storageClass: longhorn
      size: 1Gi
      mountPath: /root/.affine/config

  home-ops-route-chart:
    enabled: true
    host: affine.schober.dev
    backend:
      port: 3010

  externalSecrets:
    # AFFiNE's OIDC client secret. Also configured in Authentik through
    # AUTHENTIK_AFFINE_CLIENT_SECRET (same Bitwarden item).
    oidc:
      enabled: true
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden-app-secrets
      data:
        - secretKey: clientSecret
          remoteRef:
            key: authentik-affine-client-secret

    valkey:
      enabled: true
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden-app-secrets
      data:
        - secretKey: password
          remoteRef:
            key: valkey-password

    db-url:
      enabled: true
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden-cnpg-secrets
      data:
        - secretKey: password
          remoteRef:
            key: affine-db-secret
      template:
        data:
          DATABASE_URL: 'postgresql://affine:{{ .password | urlquery }}@affine-postgres-rw.affine.svc.cluster.local:5432/affine'

# ──────────────────────────────────────────────
# Database (home-ops-cnpg-cluster-chart)
# ──────────────────────────────────────────────
home-ops-cnpg-cluster-chart:
  enabled: true
  cluster:
    imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.15-1.1.1
    storage:
      size: 5Gi
      class: openebs-hostpath
    postInitSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  backup:
    schedule: "0 0 4 * * *"
    credentials:
      accessKeyIdRef: affine-backup-id
      secretAccessKeyRef: affine-backup-secret
