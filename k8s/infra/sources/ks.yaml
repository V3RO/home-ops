apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/sources
  prune: true
  healthChecks:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: istio
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: jetstack
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: intel
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: headlamp-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: local-path-provisioner-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: longhorn-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: volsync-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: cloudnative-pg-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: snapshot-controller-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: argo-cd-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: node-feature-discovery-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: controlplaneio-fluxcd
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: stakater-repo
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: kgateway-repo
      namespace: flux-system
