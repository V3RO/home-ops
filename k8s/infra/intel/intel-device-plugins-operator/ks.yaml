apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-device-plugins-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/intel/intel-device-plugins-operator
  prune: true
  dependsOn:
    - name: namespaces
    - name: sources
    # deploys NodeFeatureRule CRs
    - name: node-feature-discovery
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: intel-device-plugins-operator
      namespace: flux-system
