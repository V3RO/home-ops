apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: "0.37.1"
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  releaseName: intel-device-plugins-operator
  targetNamespace: intel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
    # Keep SSA enabled now that the stale DLB/FPGA webhooks are gone. If a
    # future chart removes webhooks again, temporarily switch to client-side
    # apply due to cert-manager cainjector's field ownership.
    # https://github.com/kubernetes/kubernetes/issues/128102
    serverSideApply: enabled
  values:
    manager:
      devices:
        gpu: true

