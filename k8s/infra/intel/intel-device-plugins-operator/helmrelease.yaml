apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: "0.37.1"
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  releaseName: intel-device-plugins-operator
  targetNamespace: intel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
    serverSideApply: disabled
  values:
    manager:
      devices:
        gpu: true

