apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  releaseName: intel-device-plugins-gpu
  targetNamespace: intel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  dependsOn:
    - name: intel-device-plugins-operator
      namespace: flux-system
  values:
    name: igpu
    sharedDevNum: 5

