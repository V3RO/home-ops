apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: trust-manager
      version: "v0.22.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  releaseName: trust-manager
  targetNamespace: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  values:
    crds:
      enabled: true


