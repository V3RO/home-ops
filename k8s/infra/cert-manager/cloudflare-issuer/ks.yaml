apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-issuer
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/cert-manager/cloudflare-issuer
  prune: true
  dependsOn:
    - name: cert-manager
    # API token ExternalSecret needs the ClusterSecretStores from
    # external-secrets-config
    - name: external-secrets-config
    # ca-bundle Bundle needs trust-manager
    - name: trust-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudflare-issuer
      namespace: flux-system
