apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kgateway-external
  namespace: {{ .Release.Namespace }}
  annotations:
    # Dedicated public VIP from the lb-pool-01 Cilium pool. Same mechanism the
    # NetBird STUN service uses for its 10.1.40.90 address.
    io.cilium/lb-ipam-ips: 10.1.40.91
spec:
  gatewayClassName: kgateway
  listeners:
    # Only the NetBird hostname is served. Routes are additionally restricted to
    # the netbird namespace so no other application can attach here.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "netbird.schober.dev"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: netbird
      tls:
        mode: Terminate
        certificateRefs:
          - name: netbird-schober-dev-tls
            kind: Secret
            group: ""
