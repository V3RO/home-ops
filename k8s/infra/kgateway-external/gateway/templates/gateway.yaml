apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kgateway-external
  namespace: {{ .Release.Namespace }}
  annotations:
    # external-dns reads this in preference to the Gateway's status address.
    # Without it the published target would be the Cilium VIP (10.1.40.91),
    # which is RFC1918 and must never reach the public zone.
    external-dns.alpha.kubernetes.io/target: 80.108.88.161
spec:
  gatewayClassName: kgateway
  # Note: Gateway.spec.infrastructure.annotations is NOT propagated onto the
  # generated Service by kgateway v2.4.4, so the Cilium VIP (10.1.40.91) and the
  # source-IP-preserving traffic policy are configured on the referenced
  # GatewayParameters instead.
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: kgateway-external
  listeners:
    # Only the NetBird hostname is served. Routes are additionally restricted to
    # the netbird namespace so no other application can attach here.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "netbird.schober.dev"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: netbird
      tls:
        mode: Terminate
        certificateRefs:
          - name: netbird-schober-dev-tls
            kind: Secret
            group: ""
    # Authentik's login UI must be publicly reachable: the OIDC flow redirects
    # the user's browser here directly, so it cannot live on the internal
    # gateway. Scoped to the authentik namespace like the listener above.
    - name: authentik-https
      protocol: HTTPS
      port: 443
      hostname: "auth.schober.dev"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      tls:
        mode: Terminate
        certificateRefs:
          - name: authentik-schober-dev-tls
            kind: Secret
            group: ""
