apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kgateway-external
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: kgateway
  # Note: Gateway.spec.infrastructure.annotations is NOT propagated onto the
  # generated Service by kgateway v2.4.4, so the Cilium VIP (10.1.40.91) and the
  # source-IP-preserving traffic policy are configured on the referenced
  # GatewayParameters instead.
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: kgateway-external
  listeners:
    # Only the NetBird hostname is served. Routes are additionally restricted to
    # the netbird namespace so no other application can attach here.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "netbird.schober.dev"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: netbird
      tls:
        mode: Terminate
        certificateRefs:
          - name: netbird-schober-dev-tls
            kind: Secret
            group: ""
