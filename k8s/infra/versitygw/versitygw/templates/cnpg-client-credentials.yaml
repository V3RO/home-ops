apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: versitygw-client-secret
  namespace: {{ .Release.Namespace }}
spec:
  length: 42
  noUpper: false
  allowRepeat: true
  # 42 alphanumeric characters (~250 bits) and NO symbols.
  #
  # The generator's default symbol set is
  # "~!@#$%^&*()_+`-={}|[]\:\"<>?,./" and it shuffles the result, so the
  # password can START WITH `-`. That is not cosmetic: `mc alias set <alias>
  # <endpoint> <key> <secret>` decides what is a flag by looking at argv, not
  # at shell quoting, so a secret beginning with `-` is parsed as an unknown
  # flag and the upload fails with "flag provided but not defined: -<secret>"
  # -- while printing the secret into the Job log. Observed exactly that on
  # the Minecraft backup Job.
  #
  # Removing symbols costs nothing here and removes the whole class of
  # "generated credential is not a valid command-line argument" failures for
  # every S3 consumer this chart feeds (`mc`, `aws`, and shell scripts).
  # Existing credentials are unaffected: every client ExternalSecret uses
  # refreshPolicy: CreatedOnce, so this only applies to newly generated ones.
  symbols: 0
---
{{- range .Values.cnpgClients }}
{{- $app := . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-versitygw-generated
  namespace: {{ $.Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $app }}-versitygw-generated
    template:
      engineVersion: v2
      data:
        accessKeyId: "{{ $app }}-backup"
        secretAccessKey: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: versitygw-client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $app }}-versitygw-push
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: Replace
  secretStoreRefs:
    - name: bitwarden-cnpg-secrets
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ $app }}-versitygw-generated
  data:
    - match:
        secretKey: accessKeyId
        remoteRef:
          remoteKey: {{ $app }}-backup-id
    - match:
        secretKey: secretAccessKey
        remoteRef:
          remoteKey: {{ $app }}-backup-secret
---
{{- end }}
