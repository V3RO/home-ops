{{- /*
The shared cnpg-backups bucket: every CNPG client writes its own prefix, and
the policy is re-declared in full from .Values.cnpgClients on every run
(bucket policies are replace, not merge).
*/}}
{{- $statements := list }}
{{- $principals := list }}
{{- range .Values.cnpgClients }}
{{- $principals = append $principals (printf "%s-backup" .) }}
{{- $statements = append $statements (dict
      "Effect" "Allow"
      "Principal" (dict "AWS" (list (printf "%s-backup" .)))
      "Action" (list "s3:PutObject" "s3:GetObject" "s3:DeleteObject")
      "Resource" (list (printf "arn:aws:s3:::cnpg-backups/%s/*" .))) }}
{{- end }}
{{- $statements = append $statements (dict
      "Effect" "Allow"
      "Principal" (dict "AWS" $principals)
      "Action" (list "s3:ListBucket")
      "Resource" (list "arn:aws:s3:::cnpg-backups")) }}
{{- $policy := dict "Version" "2012-10-17" "Statement" $statements | toJson }}
apiVersion: batch/v1
kind: Job
metadata:
  # Hashed for the same reason as versitygw-create-users: spec.template is
  # immutable, and POLICY_JSON is part of it, so adding a cnpgClient would
  # otherwise be rejected on apply and roll the HelmRelease back.
  name: cnpg-backups-bucket-setup-{{ printf "%s|%s"
        ($.Files.Get "files/bucket-setup.sh" | sha256sum)
        $policy | sha256sum | trunc 8 }}
  namespace: {{ .Release.Namespace }}
spec:
  # Generous because these Jobs are scheduled alongside versitygw on a
  # fresh cluster. The scripts wait for the gateway themselves; this is
  # the outer guard for the pod dying some other way.
  backoffLimit: 6
  ttlSecondsAfterFinished: {{ .Values.jobTTLSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: scripts
          configMap:
            name: versitygw-setup-scripts
      containers:
        - name: bucket-setup
          image: curlimages/curl:8.11.1
          command: ["sh", "/scripts/bucket-setup.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          env:
            - name: ADMIN
              value: http://versitygw.{{ .Release.Namespace }}.svc.cluster.local:7071
            - name: S3
              value: http://versitygw.{{ .Release.Namespace }}.svc.cluster.local:7070
            - name: SIGV4
              value: aws:amz:{{ .Values.versitygw.gateway.region }}:s3
            - name: BUCKET
              value: cnpg-backups
            - name: POLICY_JSON
              value: {{ $policy | quote }}
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootAccessKeyId
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootSecretAccessKey
