{{- $adopt := .Values.adopt | default dict }}
{{- if and .Values.versitygw.persistence.enabled $adopt.dataset }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.versitygw.persistence.claimName }}
spec:
  capacity:
    storage: {{ .Values.versitygw.persistence.size }}
  accessModes:
    - {{ .Values.versitygw.persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.versitygw.persistence.storageClassName }}
  mountOptions:
    - noatime
    - nfsvers=4
    - rsize=131072
    - wsize=131072
  csi:
    driver: org.democratic-csi.nfs
    volumeHandle: {{ $adopt.dataset }}
    volumeAttributes:
      node_attach_driver: nfs
      provisioner_driver: freenas-api-nfs
      server: {{ $adopt.server | quote }}
      share: /mnt/{{ $adopt.datasetParent }}/{{ $adopt.dataset }}
{{- end }}
