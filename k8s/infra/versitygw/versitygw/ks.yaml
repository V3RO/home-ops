apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: versitygw
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/versitygw/versitygw
  prune: true
  dependsOn:
    - name: namespaces
    # PVCs use the truenas-nfs-media storage class
    - name: democratic-csi-nfs
    # versitygw-credentials ExternalSecret
    - name: external-secrets-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: versitygw
      namespace: flux-system
