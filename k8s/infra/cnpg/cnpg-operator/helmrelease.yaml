apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.27.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg-repo
        namespace: flux-system
  releaseName: cnpg-operator
  targetNamespace: cnpg
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
  values:
    # The operator chart bundles the official CloudNativePG Grafana dashboard
    # as a subchart (charts/cluster). Creating it in the Grafana namespace lets
    # Grafana's dashboard sidecar discover it via the grafana_dashboard=1 label.
    monitoring:
      grafanaDashboard:
        create: true
        namespace: monitoring

