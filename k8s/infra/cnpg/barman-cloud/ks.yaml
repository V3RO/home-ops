apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/cnpg/barman-cloud
  prune: true
  dependsOn:
    # CNPG-I plugin, registers with the operator
    - name: cnpg-operator
    # plugin webhook certificates are issued by cert-manager
    - name: cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: barman-cloud
      namespace: flux-system
