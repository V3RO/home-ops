apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/netbird/netbird
  prune: true
  dependsOn:
    - name: namespaces
    - name: gateway-api
    - name: kgateway
    - name: gateway
    - name: cnpg-operator
    - name: barman-cloud
    - name: external-secrets-config
    - name: zot-repository
    - name: versitygw
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: netbird
      namespace: flux-system
