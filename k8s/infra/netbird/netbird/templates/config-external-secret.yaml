apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          server:
            listenAddress: ":80"
            # The combined server derives the signal URI from exposedAddress and
            # the client dials it verbatim, so it needs an explicit port or
            # clients fail with "missing port in address". Do NOT set
            # server.signalUri instead: that marks signal as external and
            # disables the built-in signal service.
            exposedAddress: {{ printf "%s:443" (.Values.netbird.server.publicUrl | trimSuffix "/") | quote }}
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"
            authSecret: "{{ `{{ .authSecret }}` }}"
            dataDir: {{ printf "%s/" (.Values.netbird.persistence.mountPath | trimSuffix "/") | quote }}
            disableAnonymousMetrics: {{ .Values.netbird.server.disableAnonymousMetrics }}
            disableGeoliteUpdate: {{ .Values.netbird.server.disableGeoliteUpdate }}
            tls:
              certFile: ""
              keyFile: ""
              letsencrypt:
                enabled: false
                dataDir: ""
                domains: []
                email: ""
                awsRoute53: false
            auth:
              issuer: {{ .Values.netbird.server.auth.issuer | quote }}
              localAuthDisabled: {{ .Values.netbird.server.auth.localAuthDisabled }}
              signKeyRefreshEnabled: {{ .Values.netbird.server.auth.signKeyRefreshEnabled }}
              dashboardRedirectURIs:
                - {{ printf "%s/nb-auth" (.Values.netbird.server.publicUrl | trimSuffix "/") | quote }}
                - {{ printf "%s/nb-silent-auth" (.Values.netbird.server.publicUrl | trimSuffix "/") | quote }}
              cliRedirectURIs:
                - "http://localhost:53000/"
              {{- if and .Values.externalSecret.keys.ownerEmail .Values.externalSecret.keys.ownerPassword }}
              # Break-glass local administrator. Seeded by the embedded IdP, so
              # it takes effect when the account is first initialised and needs
              # localAuthDisabled=false to be usable. Credentials come from
              # Bitwarden, never from values.
              owner:
                email: "{{ `{{ .ownerEmail }}` }}"
                password: "{{ `{{ .ownerPassword }}` }}"
              {{- end }}
            store:
              # Derived from helmrelease.yaml: database.mode=external with
              # engine=postgres and no raw dsn. The chart injects the DSN via
              # NETBIRD_STORE_ENGINE_POSTGRES_DSN and the postgres driver
              # expands $(NETBIRD_DATABASE_PASSWORD) from the pod env, so
              # neither a dsn nor a password belongs in this file.
              engine: "postgres"
              dsn: ""
              # Must be stable across restarts: the server encrypts user
              # records at rest with it, and regenerating it makes existing
              # rows undecryptable (auth then fails with "message
              # authentication failed"). Sourced from Bitwarden, not values,
              # so it never lands in git.
              encryptionKey: "{{ `{{ .encryptionKey }}` }}"
  data:
    - secretKey: authSecret
      remoteRef:
        key: {{ .Values.externalSecret.keys.authSecret | quote }}
    - secretKey: encryptionKey
      remoteRef:
        key: {{ .Values.externalSecret.keys.encryptionKey | quote }}
    {{- if .Values.externalSecret.keys.ownerEmail }}
    - secretKey: ownerEmail
      remoteRef:
        key: {{ .Values.externalSecret.keys.ownerEmail | quote }}
    {{- end }}
    {{- if .Values.externalSecret.keys.ownerPassword }}
    - secretKey: ownerPassword
      remoteRef:
        key: {{ .Values.externalSecret.keys.ownerPassword | quote }}
    {{- end }}
