apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./k8s/infra/netbird/netbird
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  releaseName: netbird
  targetNamespace: netbird
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    externalSecret:
      refreshInterval: 1h
      secretStoreRef:
        name: bitwarden-app-secrets
        kind: ClusterSecretStore
      targetSecretName: netbird-config
      keys:
        authSecret: netbird-auth-secret
        # Data-store encryption key: encrypts user records at rest and must
        # stay stable across restarts, so it comes from Bitwarden rather than
        # being chart-generated.
        encryptionKey: netbird-encryption-key
        # Break-glass local administrator, seeded by the embedded IdP on first
        # account initialisation. Needs localAuthDisabled=false to sign in.
        ownerEmail: netbird-owner-email
        ownerPassword: netbird-owner-password

    home-ops-cnpg-cluster-chart:
      nameOverride: netbird
      cluster:
        name: netbird-postgres
        instances: 3
        imageName: ghcr.io/cloudnative-pg/postgresql:18.1
        storage:
          size: 10Gi
          class: openebs-hostpath
        database: netbird
        owner: netbird
      backup:
        enabled: true
        schedule: "0 30 3 * * *"
        retentionPolicy: 14d
        objectStore:
          name: netbird-versitygw-store
          destinationPath: s3://cnpg-backups/netbird/
          endpointURL: http://versitygw.versitygw.svc.cluster.local:7070
          region: homelab
          compression: gzip
        credentials:
          secretName: netbird-backup-credentials
          accessKeyIdRef: netbird-backup-id
          secretAccessKeyRef: netbird-backup-secret
      credentials:
        remoteKey: netbird-database-password

    netbird:
      server:
        replicaCount: 1
        publicUrl: https://netbird.schober.dev
        config:
          # Full config.yaml is delivered by the ExternalSecret in
          # templates/config-external-secret.yaml, so the chart does not render
          # its own config Secret from values (which would require
          # server.authSecret as a plain string in this public repository).
          existingSecret: netbird-config
        auth:
          # Authentik is the identity provider; the embedded IdP is only used
          # as the OIDC endpoint the dashboard authenticates against.
          issuer: https://netbird.schober.dev/oauth2
          # false keeps the break-glass local owner reachable. Set true to
          # force all logins through the external IdP.
          localAuthDisabled: true
        service:
          type: ClusterIP
      dashboard:
        enabled: true
        replicaCount: 1
      database:
        mode: external
        external:
          engine: postgres
          host: netbird-postgres-rw.netbird.svc.cluster.local
          port: 5432
          name: netbird
          username: netbird
          existingSecret: cnpg-netbird-credentials
          existingSecretPasswordKey: password
          sslMode: disable
      postgresql:
        enabled: false
      persistence:
        enabled: true
        size: 5Gi
        storageClass: longhorn
      # The data PVC is ReadWriteOnce and the chart only uses the Recreate
      # strategy for its sqlite store, so with external Postgres a plain
      # rollout deadlocks: the new pod waits for a volume the old pod still
      # holds. Reloader tears the old pod down first, which also means config
      # changes arriving from Bitwarden (authSecret, encryptionKey) actually
      # take effect instead of sitting in the Secret unread.
      podAnnotations:
        reloader.stakater.com/auto: "true"
      serviceAccount:
        automountServiceAccountToken: false
      gatewayAPI:
        enabled: true
        httpRoutes:
          - name: netbird
            parentRefs:
              # Dedicated public Gateway: its own Cilium VIP (10.1.40.91) and a
              # leaf certificate, so NetBird no longer shares internal-gateway's
              # wildcard certificate or address.
              - name: kgateway-external
                namespace: kgateway-external
                sectionName: https
            hostnames:
              - netbird.schober.dev
            rules:
              # Preserve h2c for gRPC methods handled by the combined server.
              - matches:
                  - path:
                      type: PathPrefix
                      value: /signalexchange.SignalExchange/
                  - path:
                      type: PathPrefix
                      value: /management.ManagementService/
                  - path:
                      type: PathPrefix
                      value: /management.ProxyService/
                backendRefs:
                  - name: netbird-server-h2c
                    port: 80
              # Control API, embedded IdP, relay, and websocket endpoints.
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                  - path:
                      type: PathPrefix
                      value: /oauth2
                  - path:
                      type: PathPrefix
                      value: /relay
                  # Whole ws-proxy prefix rather than only the management and
                  # signal subpaths, so a new proxied component cannot fall
                  # through to the dashboard route.
                  - path:
                      type: PathPrefix
                      value: /ws-proxy/
                backendRefs:
                  - name: netbird-server
                    port: 80
              # Dashboard UI and authentication callbacks.
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: netbird-dashboard
                    port: 80
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      networkPolicy:
        enabled: false
