apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: snapshot-controller
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: snapshot-controller-repo
        namespace: flux-system
  releaseName: snapshot-controller
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
  values:
    controller:
      enabled: true
      replicaCount: 1

    validatingWebhook:
      enabled: false

