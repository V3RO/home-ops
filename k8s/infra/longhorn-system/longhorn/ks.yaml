apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/longhorn-system/longhorn
  prune: true
  dependsOn:
    - name: namespaces
    # VolumeSnapshot CRDs for CSI snapshots
    - name: snapshot-controller
    # ClusterSecretStores for the backup credential ExternalSecrets
    - name: external-secrets-config
    # S3 backup target endpoint (versitygw) must exist before the bucket
    # setup Job runs
    - name: versitygw
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: longhorn
      namespace: flux-system
