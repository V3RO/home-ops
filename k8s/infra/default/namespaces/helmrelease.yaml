apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: namespaces
  namespace: flux-system
  annotations:
    # Never garbage-collect this release: helm uninstalling it would delete
    # every namespace and cascade into all cluster workloads.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: ./k8s/infra/default/namespaces
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  releaseName: namespaces
  targetNamespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Ambient mesh enrollment is default-on cluster-wide (see the cni
    # component's ambient.enablementSelectors). Namespaces labeled
    # istio.io/dataplane-mode: none opt out; everything unlabeled is enrolled.
    namespaces:
      - name: istio-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
      - name: istio-ingress-internal
        labels:
          istio.io/dataplane-mode: none
      - name: kgateway-system
        labels:
          istio.io/dataplane-mode: none
      - name: kgateway-external
        labels:
          istio.io/dataplane-mode: none
      - name: argocd
        labels:
          istio.io/dataplane-mode: none
      - name: external-dns
      - name: cert-manager
      - name: external-secrets
        labels:
          istio.io/dataplane-mode: none
      - name: authentik
      - name: cnpg
        labels:
          istio.io/dataplane-mode: none
      - name: monitoring
        labels:
          pod-security.kubernetes.io/enforce: privileged
      - name: valkey
        labels:
          istio.io/dataplane-mode: none
      - name: versitygw
      - name: n8n
      - name: mealie
      - name: homepage
      - name: paperless
      - name: zot
      - name: forgejo
        labels:
          pod-security.kubernetes.io/enforce: privileged
      - name: external-services
        labels:
          istio.io/dataplane-mode: none
      - name: intel
        labels:
          pod-security.kubernetes.io/enforce: privileged
      - name: node-feature-discovery
        labels:
          istio.io/dataplane-mode: none
          pod-security.kubernetes.io/enforce: privileged
      - name: adguard
      - name: actual
      - name: immich
      - name: netbird
      - name: media
        labels:
          istio.io/dataplane-mode: none
          pod-security.kubernetes.io/enforce: privileged
      - name: netbird-router
        labels:
          istio.io/dataplane-mode: none
          # The NetBird routing-peer client needs NET_ADMIN/SYS_ADMIN/
          # SYS_RESOURCE to create its WireGuard interface and route cluster
          # VIP traffic, so it cannot run under the restricted profile. Keeping
          # it in its own namespace avoids relaxing the netbird namespace,
          # where the unprivileged server and dashboard live.
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
      - name: it-tools
      - name: uptime-kuma
      - name: kiali
      - name: vert-sh
      - name: rancher
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
      - name: democratic-csi
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
      - name: longhorn-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
      - name: openebs
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
      - name: volsync-system
      - name: reloader
      - name: bentopdf
      # Minecraft is raw custom TCP on 25565 with long-lived game sessions.
      # L4 interception by ztunnel adds a variable that is hard to debug and
      # buys nothing here, so both namespaces opt out of the ambient mesh
      # explicitly rather than inheriting the cluster-wide default.
      - name: minecraft
        labels:
          istio.io/dataplane-mode: none
      # The router holds cluster-wide read on Services, so it is deliberately
      # kept out of the namespace that runs the game containers.
      - name: mc-router
        labels:
          istio.io/dataplane-mode: none
