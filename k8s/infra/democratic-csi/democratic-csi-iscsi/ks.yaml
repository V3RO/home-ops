apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: democratic-csi-iscsi
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/democratic-csi/democratic-csi-iscsi
  prune: true
  dependsOn:
    - name: namespaces
    # TrueNAS credentials ExternalSecret
    - name: external-secrets-config
    # VolumeSnapshotClass
    - name: snapshot-controller
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: democratic-csi-iscsi
      namespace: flux-system
