apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-localpv-provisioner
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: localpv-provisioner
      version: "4.6.0"
      sourceRef:
        kind: HelmRepository
        name: openebs-localpv-provisioner-repo
        namespace: flux-system
  releaseName: openebs-localpv-provisioner
  targetNamespace: openebs
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    analytics:
      enabled: false

    localpv:
      # Provided by the `openebs-local` UserVolumeConfig in talos/patches/machine.yaml.
      basePath: /var/mnt/openebs-local

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule

    hostpathClass:
      name: openebs-hostpath
      isDefaultClass: false
      reclaimPolicy: Retain
      xfsQuota:
        enabled: true
