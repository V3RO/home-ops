apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: ./k8s/infra/external-dns/external-dns-cloudflare
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  releaseName: external-dns-cloudflare
  targetNamespace: external-dns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    external-dns:
      provider:
        name: cloudflare
      env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: external-dns-cloudflare-secret
              key: api-token
      sources:
        - gateway-httproute
      # Only the public Gateway lives here; the internal-gateway is handled by
      # the separate external-dns-unifi instance and both must not fight over
      # the same hostnames.
      gatewayNamespace: kgateway-external
      domainFilters:
        - schober.dev
      policy: sync
      txtOwnerId: external-dns-cloudflare
      txtPrefix: k8s-cloudflare.
      extraArgs:
        # The Gateway's status address is the Cilium VIP 10.1.40.91, which is
        # RFC1918 and must never reach the public zone. Publish the static WAN
        # IP that TCP 443 is forwarded to instead.
        - --default-targets=80.108.88.161
        # Hard guard: even if a Gateway or Service in the watched namespace
        # reports a private address, refuse to publish it.
        - --exclude-target-net=10.0.0.0/8
