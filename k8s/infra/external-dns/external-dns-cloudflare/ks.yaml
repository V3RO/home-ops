apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-cloudflare
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/external-dns/external-dns-cloudflare
  prune: true
  dependsOn:
    - name: namespaces
    # Cloudflare API token ExternalSecret
    - name: external-secrets-config
    # The Gateway it watches must exist first
    - name: kgateway-external
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns-cloudflare
      namespace: flux-system
