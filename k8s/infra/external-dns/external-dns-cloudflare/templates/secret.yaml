apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  target:
    name: external-dns-cloudflare-secret
  data:
    # Same Bitwarden item the cloudflare-letsencrypt ClusterIssuer uses.
    - secretKey: api-token
      remoteRef:
        key: "cloudflare-token"
