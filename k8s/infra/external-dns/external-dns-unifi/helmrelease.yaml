apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-unifi
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: ./k8s/infra/external-dns/external-dns-unifi
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  releaseName: external-dns-unifi
  targetNamespace: external-dns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    external-dns:
      logLevel: &logLevel debug
      gatewayNamespace: istio-ingress-internal
      provider:
        name: webhook
        webhook:
          image:
            repository: ghcr.io/kashalls/external-dns-unifi-webhook
            tag: "v0.7.0"
          env:
            - name: UNIFI_HOST
              value: https://192.168.1.1
            - name: UNIFI_EXTERNAL_CONTROLLER
              value: "false"
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-dns-unifi-secret
                  key: api-key
            - name: LOG_LEVEL
              value: *logLevel
      extraArgs:
        - --ignore-ingress-tls-spec
        - --source=gateway-httproute
      policy: sync
      sources: [ "ingress", "service" ]
      txtOwnerId: default
      txtPrefix: k8s.

