# The operator adopts the bootstrap helm release installed by tofu (same
# release name/namespace), making the operator itself git-managed after the
# initial cluster bootstrap.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: flux-operator
      version: "0.58.0"
      sourceRef:
        kind: HelmRepository
        name: controlplaneio-fluxcd
        namespace: flux-system
  releaseName: flux-operator
  targetNamespace: flux-system
  valuesFrom:
    - kind: Secret
      name: flux-authentik-oidc
      valuesKey: client-secret
      targetPath: web.config.authentication.oauth2.clientSecret
  values:
    web:
      config:
        baseURL: https://flux.schober.dev
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            clientID: flux-web
            issuerURL: https://auth.schober.dev/application/o/flux/
            scopes:
              - openid
              - profile
              - email
              - groups
      httpRoute:
        enabled: true
        hostnames:
          - flux.schober.dev
        parentRefs:
          - name: internal-gateway
            namespace: istio-ingress-internal
            sectionName: https
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
