apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point reconciled by the root 'infra' Flux Kustomization.
# Only references the per-component ks.yaml files (via the namespace
# aggregators); component content is built by the component Kustomizations.
resources:
  - ./sources/ks.yaml
  - ./argocd
  - ./authentik
  - ./cert-manager
  - ./cnpg
  - ./default
  - ./democratic-csi
  - ./external-dns
  - ./external-secrets
  - ./flux-system
  - ./intel
  - ./istio-ingress-internal
  - ./istio-system
  - ./kgateway-system
  - ./kube-system
  - ./longhorn-system
  - ./monitoring
  - ./node-feature-discovery
  - ./openebs
  - ./reloader
  - ./valkey
  - ./versitygw
  - ./volsync-system
