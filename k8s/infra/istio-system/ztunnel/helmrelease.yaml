apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ztunnel
      version: "1.30.4"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  releaseName: ztunnel
  targetNamespace: istio-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  dependsOn:
    - name: base
      namespace: flux-system
    - name: istiod
      namespace: flux-system
  values:

