apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-router-setup-key
  namespace: netbird-router
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-app-secrets
    kind: ClusterSecretStore
  target:
    name: netbird-router-setup-key
  data:
    # Reusable, ephemeral setup key from the NetBird dashboard, with the
    # kubernetes-routers group set as an auto-assigned group.
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: netbird-router-setup-key
