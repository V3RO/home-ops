# ArgoCD manages the user-facing apps (k8s/apps via the apps ApplicationSet)
# and is deployed last by Flux, once everything it consumes is healthy:
# Valkey (externalRedis), the internal Gateway (HTTPRoute), authentik (dex
# OIDC) and the ClusterSecretStores (argo ExternalSecrets).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/argocd/argo
  prune: true
  dependsOn:
    - name: namespaces
    - name: valkey
    - name: gateway
    - name: authentik
    - name: external-secrets-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: argo
      namespace: flux-system
