apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-grafana-backup-credentials
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: bitwarden-cnpg-secrets
    kind: ClusterSecretStore
  target:
    name: cnpg-grafana-backup-credentials
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ `{{ .versitygw_access_key_id }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .versitygw_secret_access_key }}` }}"
  data:
    # grafana's own versitygw account (see
    # k8s/infra/versitygw/versitygw/templates/cnpg-client-credentials.yaml
    # and BOOTSTRAP.md) — not the shared root credentials.
    - secretKey: versitygw_access_key_id
      remoteRef:
        key: grafana-backup-id
    - secretKey: versitygw_secret_access_key
      remoteRef:
        key: grafana-backup-secret
