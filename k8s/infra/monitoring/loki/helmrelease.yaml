apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ./k8s/infra/monitoring/loki
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  releaseName: loki
  targetNamespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  dependsOn:
    - name: prometheus
      namespace: flux-system
  values:
    loki:
      # Use single binary deployment mode (non-HA)
      deploymentMode: SingleBinary

      loki:
        # Disable auth for homelab simplicity
        auth_enabled: false

        # Simple schema config for homelab
        schemaConfig:
          configs:
            - from: "2024-01-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h

        storage:
          type: filesystem

        # Ruler storage configuration
        rulerConfig:
          storage:
            type: local
            local:
              directory: /var/loki/rules

        # Single replica
        commonConfig:
          replication_factor: 1

      # Disable write and read deployments (using singleBinary)
      write:
        replicas: 0

      read:
        replicas: 0

      backend:
        replicas: 0

      gateway:
        enabled: false

      # Single binary mode with persistence
      singleBinary:
        replicas: 1
        persistence:
          enabled: true
          storageClass: longhorn
          size: 10Gi

      # Disable all caches to save memory
      chunksCache:
        enabled: false

      resultsCache:
        enabled: false

      # Disable test components
      lokiCanary:
        enabled: false

      test:
        enabled: false

