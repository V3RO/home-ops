apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ./k8s/infra/monitoring/thanos
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  releaseName: thanos
  targetNamespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  dependsOn:
    - name: prometheus
      namespace: flux-system
  values:
    thanos:
      global:
        # No Prometheus Operator in this cluster, so no PrometheusRule CRD.
        thanosRules:
          enabled: false

        # Secret is created by the ExternalSecret in the prometheus chart
        # (k8s/infra/monitoring/prometheus/templates/thanos-objstore.yaml).
        objstore:
          createSecret: false
          secretName: thanos-objstore
          secretKey: objstore.yml

      # BucketWeb: read-only browser for the blocks in the bucket.
      bucket:
        enabled: true
        bucketweb:
          enabled: true

      # Prometheus sidecar (live and recent data). Historical data comes from
      # the store gateway, which the chart wires up automatically.
      query:
        enabled: true
        replicaCount: 1
        endpoints:
          static:
            - prometheus-thanos-sidecar.monitoring.svc.cluster.local:10901
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

      storegateway:
        enabled: true
        replicaCount: 1
        persistence:
          enabled: true
          storageClass: longhorn
          size: 5Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

      # The chart's compactor is always-on (--wait); the CronJob below
      # (templates/compactor-cronjob.yaml) replaces it with a daily one-shot.
      compactor:
        enabled: false
      queryFrontend:
        enabled: false
      receive:
        enabled: false
      ruler:
        enabled: false

    compactorCronJob:
      enabled: true
      image: quay.io/thanos/thanos:v0.42.4
      schedule: "0 3 * * *"
      activeDeadlineSeconds: 7200
      scratchSize: 10Gi
      # Downsampling to 5m starts for blocks older than 40h and to 1h older
      # than 10d, so raw retention must stay above 40h and 5m above 10d.
      retention:
        raw: 7d
        fiveMinute: 30d
        oneHour: 90d
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Neither the Thanos Query UI nor BucketWeb supports OIDC, so both are
    # served through the internal gateway behind the shared Authentik proxy
    # outpost (kgateway ext-auth), like the media UIs.
    ui:
      gateway:
        name: internal-gateway
        namespace: istio-ingress-internal
        sectionName: https
      authentik:
        outpostService:
          name: ak-outpost-proxy
          namespace: authentik
          port: 9000
        pathPrefix: /outpost.goauthentik.io/auth/envoy
        headersToForward:
          - cookie
        headersToBackend:
          - set-cookie
          - x-authentik-username
          - x-authentik-groups
          - x-authentik-entitlements
          - x-authentik-email
          - x-authentik-name
          - x-authentik-uid
          - x-authentik-jwt
          - x-authentik-meta-jwks
          - x-authentik-meta-outpost
          - x-authentik-meta-provider
          - x-authentik-meta-app
          - x-authentik-meta-version
        headersToClientOnSuccess:
          - cookie
      routes:
        - name: thanos-query
          host: thanos.schober.dev
          service: thanos-query
          port: 9090
        - name: thanos-bucket
          host: thanos-bucket.schober.dev
          service: thanos-bucketweb
          port: 10902
