apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/istio-ingress-internal/gateway
  prune: true
  dependsOn:
    - name: namespaces
    - name: kgateway
    # TLS Certificates reference the cloudflare-letsencrypt ClusterIssuer
    - name: cloudflare-issuer
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gateway
      namespace: flux-system
