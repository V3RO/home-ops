apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: kgateway
      version: "2.4.4"
      sourceRef:
        kind: HelmRepository
        name: kgateway-repo
        namespace: flux-system
  releaseName: kgateway
  targetNamespace: kgateway-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  dependsOn:
    - name: kgateway-crds
      namespace: flux-system
  values:
    controller:
      logLevel: info
      prometheusAnnotations: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    waypoint:
      enabled: false
