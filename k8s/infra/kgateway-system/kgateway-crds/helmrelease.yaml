apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: kgateway-crds
      version: "2.4.4"
      sourceRef:
        kind: HelmRepository
        name: kgateway-repo
        namespace: flux-system
  releaseName: kgateway-crds
  targetNamespace: kgateway-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    crds: CreateReplace
