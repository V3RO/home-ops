# ClusterSecretStores + TLS cert for the Bitwarden SDK server. The Certificate
# is issued by bitwarden-certificate-issuer (from the bitwarden-issuer
# component) — the operator being Ready is not enough on its own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./k8s/infra/external-secrets/config
  prune: true
  dependsOn:
    - name: external-secrets
    - name: bitwarden-issuer
